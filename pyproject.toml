# Makes the one-file client installable, which also gives it a name on the
# command line:
#
#     pip install "runlog-client[media] @ git+https://github.com/MaxxP0/runlog-client.git"
#     runlog configure
#
# The module it installs is called `wandb` on purpose (training scripts say
# `import wandb`), so never install it next to the real wandb package.
# Copying wandb.py beside a training script keeps working without any of this.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runlog-client"
version = "1.0.3"
description = "Training client for Runlog: a one-file, stdlib-only stand-in for `import wandb`."
requires-python = ">=3.9"
dependencies = []
readme = "README.md"

# What the optional parts of the client use when it is there: numpy and Pillow
# for images, imageio-ffmpeg for h264 video, psutil for machine telemetry.
[project.optional-dependencies]
media = ["numpy", "pillow", "imageio-ffmpeg", "psutil"]

[project.scripts]
runlog = "wandb:main"

[tool.setuptools]
py-modules = ["wandb"]
